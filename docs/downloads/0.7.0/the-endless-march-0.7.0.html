// ---- js/util.js
'use strict';
// Small math / collision helpers shared by every system.

const TAU = Math.PI * 2;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function approach(v, target, delta) {
  return v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);
}
function sign(v) { return v < 0 ? -1 : v > 0 ? 1 : 0; }
function rand(a, b) { return a + Math.random() * (b - a); }
function easeOutCubic(t) { t = 1 - t; return 1 - t * t * t; }
function easeInCubic(t) { return t * t * t; }
function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

function Rect(x, y, w, h) { return { x: x || 0, y: y || 0, w: w || 0, h: h || 0 }; }

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function circleRect(cx, cy, r, b) {
  const nx = clamp(cx, b.x, b.x + b.w);
  const ny = clamp(cy, b.y, b.y + b.h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

// Hitboxes are authored relative to an actor's foot-centre, facing right.
// This writes the world-space rect into `out` (no allocation), mirrored by facing.
function placeBox(out, cx, bottom, box, facing) {
  out.w = box.w;
  out.h = box.h;
  out.x = facing > 0 ? cx + box.x : cx - box.x - box.w;
  out.y = bottom + box.y;
  return out;
}

// Fixed-size object pool. Objects carry an `active` flag and are reused.
class Pool {
  constructor(create, size) {
    this.items = new Array(size);
    for (let i = 0; i < size; i++) this.items[i] = create();
  }
  obtain() {
    const it = this.items;
    for (let i = 0; i < it.length; i++) if (!it[i].active) return it[i];
    return null;
  }
  clear() {
    const it = this.items;
    for (let i = 0; i < it.length; i++) it[i].active = false;
  }
}

// ---------------------------------------------------------------- outline drawing kit
// Everything with a body (figures, enemies, weapons, structures) is drawn as a
// white shape with a black outline. `inkFlash` inverts the fill for the frame
// an actor is hit.
const INK = '#000', PAPER = '#fff', OUTLINE = 2.5;
let inkFlash = false;

// Fill the current path as an outlined shape.
function finish(ctx, flash) {
  ctx.fillStyle = (flash || inkFlash) ? INK : PAPER;
  ctx.fill();
  ctx.lineWidth = OUTLINE;
  ctx.strokeStyle = INK;
  ctx.stroke();
}

// A limb: thin ones are plain sticks, thick ones are outlined tubes.
function limb(ctx, x1, y1, x2, y2, w) {
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = INK;
  if (w < 5) {
    ctx.lineWidth = OUTLINE;
    ctx.stroke();
    return;
  }
  ctx.lineWidth = w + OUTLINE;
  ctx.stroke();
  ctx.lineWidth = w - OUTLINE;
  ctx.strokeStyle = inkFlash ? INK : PAPER;
  ctx.stroke();
  ctx.strokeStyle = INK;
}

// Outlined rectangle.
function box(ctx, x, y, w, h, flash) {
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  finish(ctx, flash);
}

// Eyes and small marks are ink on paper (paper on ink while flashing).
function eye(ctx, x, y, w, h, flash) {
  ctx.fillStyle = (flash || inkFlash) ? PAPER : INK;
  ctx.fillRect(x, y, w, h);
}

// Stroke colour for detail lines drawn inside a body.
function detailInk(flash) { return (flash || inkFlash) ? PAPER : INK; }

</script>

// ---- js/audio.js
'use strict';
// Procedural WebAudio sound. No asset files. Everything is short, dry and low.

const Sound = {
  ctx: null, out: null, noise: null, drone: null,

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 6;
      comp.connect(ctx.destination);
      this.out = ctx.createGain();
      this.out.gain.value = 0.5;
      this.out.connect(comp);
      const len = ctx.sampleRate;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      this.ctx = ctx;
    } catch (e) {
      this.ctx = null;
    }
  },

  _env(g, t, attack, decay, peak) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  },

  tone(f0, f1, dur, type, vol) {
    const ctx = this.ctx;
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    this._env(g, t, 0.005, dur, vol);
    o.connect(g);
    g.connect(this.out);
    o.start(t);
    o.stop(t + dur + 0.05);
  },

  hiss(dur, vol, freq, q, type, freqEnd) {
    const ctx = this.ctx;
    if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    const f = ctx.createBiquadFilter();
    f.type = type || 'bandpass';
    f.Q.value = q || 1;
    f.frequency.setValueAtTime(freq, t);
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    const g = ctx.createGain();
    this._env(g, t, 0.01, dur, vol);
    src.connect(f);
    f.connect(g);
    g.connect(this.out);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.05);
  },

  swing(heavy) { heavy ? this.hiss(0.24, 0.4, 1100, 0.9, 'bandpass', 260) : this.hiss(0.13, 0.26, 1800, 0.9, 'bandpass', 700); },
  hit(heavy) {
    this.tone(heavy ? 95 : 150, 38, heavy ? 0.28 : 0.14, 'sine', heavy ? 0.9 : 0.55);
    this.hiss(heavy ? 0.14 : 0.07, heavy ? 0.5 : 0.35, 2600, 0.7, 'highpass');
  },
  block() { this.tone(1900, 1300, 0.12, 'square', 0.07); this.tone(2600, 2000, 0.1, 'triangle', 0.1); },
  parry() { this.tone(1400, 2200, 0.1, 'triangle', 0.15); },
  hurt() { this.tone(230, 70, 0.3, 'sawtooth', 0.16); this.hiss(0.18, 0.35, 700, 1, 'lowpass'); },
  dash() { this.hiss(0.18, 0.22, 500, 0.6, 'bandpass', 2600); },
  jump() { this.tone(240, 380, 0.08, 'sine', 0.07); },
  land() { this.hiss(0.06, 0.12, 400, 1, 'lowpass'); },
  enemyDie(big) {
    this.tone(big ? 110 : 280, big ? 28 : 60, big ? 0.55 : 0.25, 'triangle', 0.3);
    this.hiss(big ? 0.4 : 0.22, 0.3, 1200, 0.5, 'bandpass', 180);
  },
  shoot() { this.tone(620, 280, 0.12, 'square', 0.05); },
  windup() { this.tone(90, 150, 0.35, 'sawtooth', 0.05); },
  whisper() { this.hiss(0.3, 0.12, 3200, 3, 'bandpass', 5200); },
  slam() { this.tone(72, 28, 0.45, 'sine', 0.9); this.hiss(0.35, 0.45, 320, 0.7, 'lowpass'); },
  spawn() { this.hiss(0.45, 0.06, 900, 2, 'bandpass', 180); },
  waveStart(final) {
    this.tone(final ? 55 : 110, final ? 55 : 110, 1.0, 'sine', 0.22);
    this.tone(final ? 82 : 165, final ? 82 : 165, 1.0, 'sine', 0.1);
  },
  waveClear() { this.tone(220, 220, 0.6, 'sine', 0.14); this.tone(330, 330, 0.9, 'sine', 0.1); },
  death() { this.tone(200, 36, 1.4, 'sawtooth', 0.18); this.hiss(1.0, 0.2, 400, 0.6, 'lowpass', 80); },
  rumble() { this.hiss(0.5, 0.25, 120, 0.8, 'lowpass'); },
  bowDraw() { this.hiss(0.12, 0.05, 2400, 4, 'bandpass', 1200); },
  bow(fire) {
    this.tone(180, 90, 0.12, 'triangle', 0.18);
    this.hiss(0.1, 0.22, 3000, 1.2, 'highpass');
    if (fire) this.hiss(0.5, 0.25, 700, 0.6, 'lowpass', 2400);
  },
  wave() { this.hiss(0.45, 0.35, 400, 0.8, 'bandpass', 1800); this.tone(140, 60, 0.35, 'sine', 0.25); },
  burn() { this.hiss(0.18, 0.1, 900, 0.7, 'bandpass', 400); },
  bump() { this.tone(180, 120, 0.1, 'square', 0.12); this.tone(90, 70, 0.12, 'sine', 0.4); },
  powerup() {
    const ctx = this.ctx;
    if (!ctx) return;
    // a quick rising arpeggio
    [330, 415, 494, 660].forEach((f, i) => setTimeout(() => this.tone(f, f, 0.14, 'triangle', 0.14), i * 55));
  },
  rage() { this.tone(70, 140, 0.6, 'sawtooth', 0.2); this.hiss(0.6, 0.4, 300, 0.6, 'lowpass', 1600); this.tone(55, 55, 0.8, 'sine', 0.5); },
  grab() { this.hiss(0.08, 0.3, 300, 1, 'lowpass'); this.tone(120, 80, 0.1, 'sine', 0.3); },
  pickup() { this.tone(880, 1320, 0.09, 'triangle', 0.09); this.tone(1320, 1760, 0.12, 'triangle', 0.06); },
  magic(level) {
    this.tone(60, 60 + level * 40, 0.75, 'sawtooth', 0.12);
    this.hiss(0.75, 0.15, 400, 2, 'bandpass', 3000 + level * 800);
  },
  chime() { this.tone(523, 523, 2.5, 'sine', 0.08); this.tone(784, 784, 3, 'sine', 0.04); },

  // Continuous drone for the door sequence; level 0..1.
  droneStart() {
    const ctx = this.ctx;
    if (!ctx || this.drone) return;
    const g = ctx.createGain();
    g.gain.value = 0.0001;
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 200;
    f.connect(g);
    g.connect(this.out);
    const oscs = [];
    const freqs = [55, 110.3, 164.8, 220.7];
    for (let i = 0; i < freqs.length; i++) {
      const o = ctx.createOscillator();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = freqs[i];
      o.connect(f);
      o.start();
      oscs.push(o);
    }
    const n = ctx.createBufferSource();
    n.buffer = this.noise;
    n.loop = true;
    const ng = ctx.createGain();
    ng.gain.value = 0.15;
    n.connect(ng);
    ng.connect(f);
    n.start();
    this.drone = { g, f, oscs, n };
  },
  droneSet(level) {
    if (!this.drone) return;
    const t = this.ctx.currentTime;
    this.drone.g.gain.setTargetAtTime(0.0001 + level * 0.55, t, 0.15);
    this.drone.f.frequency.setTargetAtTime(160 + level * level * 7000, t, 0.2);
  },
  droneStop(fade) {
    if (!this.drone) return;
    const d = this.drone;
    this.drone = null;
    const t = this.ctx.currentTime;
    d.g.gain.cancelScheduledValues(t);
    d.g.gain.setValueAtTime(Math.max(0.0001, d.g.gain.value), t);
    d.g.gain.exponentialRampToValueAtTime(0.0001, t + (fade || 0.05));
    const stopAt = t + (fade || 0.05) + 0.1;
    for (const o of d.oscs) o.stop(stopAt);
    d.n.stop(stopAt);
  },
};

<script>
// ---- js/input.js
'use strict';
// Keyboard / mouse / gamepad input mapped to abstract actions.
// `pressed` and `released` are edge flags consumed once per fixed update step.

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyZ: 'jump', KeyK: 'jump',
  KeyX: 'attack', KeyJ: 'attack',
  KeyF: 'back', KeyU: 'back',
  ShiftLeft: 'run', ShiftRight: 'run', KeyC: 'run',
  KeyV: 'magic', KeyQ: 'magic', KeyL: 'magic',
  KeyR: 'rage', KeyE: 'rage', KeyI: 'rage',
  Escape: 'pause', KeyP: 'pause',
  Enter: 'confirm',
};

const PAD_BUTTONS = { 0: 'jump', 2: 'attack', 1: 'back', 3: 'magic', 4: 'rage', 6: 'rage', 5: 'run', 7: 'run', 9: 'pause', 12: 'up', 13: 'down' };

const Input = {
  keyDown: {}, padDown: {}, pressed: {}, released: {},
  anyPressed: false, // any key/button this step (menus)
  padAxis: 0, padAxisZ: 0,
  // touch: a floating stick on the left half, buttons on the right
  touchMode: false, touchAxisX: 0, touchAxisZ: 0, touchRun: false,
  stick: { id: null, ox: 0, oy: 0, x: 0, y: 0 },
  touchButtons: {}, // touch id -> action
  toView: null,     // set by the game: client px -> view coords
  onTap: null,      // set by the game: menu taps
  lastTap: { left: -1, right: -1 }, doubleTap: 0, // set to -1/1 on a double tap

  init(target) {
    this._held = {}; // physical keys, so two bindings for one action behave
    window.addEventListener('keydown', (e) => {
      this._held[e.code] = true;
      Sound.init();
      const a = KEYMAP[e.code];
      if (a) e.preventDefault();
      if (e.repeat) return;
      if (a) {
        if (!this.keyDown[a]) { this.pressed[a] = true; this.tap(a); }
        this.keyDown[a] = true;
      }
      if (a !== 'pause') this.anyPressed = true;
      if (this.onRawKey) this.onRawKey(e.code);
    });
    window.addEventListener('keyup', (e) => {
      this._held[e.code] = false;
      const a = KEYMAP[e.code];
      if (!a) return;
      e.preventDefault();
      // Only release when no other key bound to the same action is held.
      let still = false;
      for (const code in this._held) if (this._held[code] && KEYMAP[code] === a) still = true;
      if (!still) {
        if (this.keyDown[a]) this.released[a] = true;
        this.keyDown[a] = false;
      }
    });

    target.addEventListener('mousedown', (e) => {
      Sound.init();
      e.preventDefault();
      const a = e.button === 2 ? 'back' : 'attack';
      this.pressed[a] = true;
      this.anyPressed = true;
    });
    target.addEventListener('contextmenu', (e) => e.preventDefault());

    const opts = { passive: false };
    target.addEventListener('touchstart', (e) => this.touchStart(e), opts);
    target.addEventListener('touchmove', (e) => this.touchMove(e), opts);
    target.addEventListener('touchend', (e) => this.touchEnd(e), opts);
    target.addEventListener('touchcancel', (e) => this.touchEnd(e), opts);
    window.addEventListener('blur', () => {
      this.keyDown = {};
      this._held = {};
    });
  },

  // ---------------------------------------------------------------- touch
  touchStart(e) {
    e.preventDefault();
    Sound.init();
    this.touchMode = true;
    for (const t of e.changedTouches) {
      const v = this.toView ? this.toView(t.clientX, t.clientY) : { x: t.clientX, y: t.clientY };
      this.anyPressed = true;
      if (this.onTap) this.onTap(v.x, v.y);
      const btn = TouchLayout.hit(v.x, v.y);
      if (btn) {
        this.touchButtons[t.identifier] = btn;
        if (!this.keyDown[btn]) { this.pressed[btn] = true; }
        this.keyDown[btn] = true;
      } else if (v.x < VIEW_W * 0.5 && this.stick.id === null) {
        const s = this.stick;
        s.id = t.identifier; s.ox = v.x; s.oy = v.y; s.x = v.x; s.y = v.y;
      }
    }
  },

  touchMove(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== this.stick.id) continue;
      const v = this.toView ? this.toView(t.clientX, t.clientY) : { x: t.clientX, y: t.clientY };
      const s = this.stick, R = TouchLayout.stickR;
      let dx = v.x - s.ox, dy = v.y - s.oy;
      const d = Math.hypot(dx, dy);
      if (d > R) { dx *= R / d; dy *= R / d; }
      s.x = s.ox + dx; s.y = s.oy + dy;
      const px = this.touchAxisX;
      this.touchAxisX = Math.abs(dx) > R * 0.3 ? sign(dx) : 0;
      this.touchAxisZ = Math.abs(dy) > R * 0.35 ? sign(dy) : 0;
      if (this.touchAxisX !== 0 && this.touchAxisX !== px) this.tap(this.touchAxisX > 0 ? 'right' : 'left');
      // pushing the stick to its rim runs
      this.touchRun = Math.abs(dx) > R * 0.9;
    }
  },

  touchEnd(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === this.stick.id) {
        this.stick.id = null;
        this.touchAxisX = 0; this.touchAxisZ = 0; this.touchRun = false;
      }
      const btn = this.touchButtons[t.identifier];
      if (btn) {
        delete this.touchButtons[t.identifier];
        let still = false;
        for (const id in this.touchButtons) if (this.touchButtons[id] === btn) still = true;
        if (!still) { this.keyDown[btn] = false; this.released[btn] = true; }
      }
    }
  },

  pollGamepad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : null;
    let pad = null;
    if (pads) for (let i = 0; i < pads.length; i++) if (pads[i]) { pad = pads[i]; break; }
    if (!pad) { this.padAxis = 0; this.padAxisZ = 0; this.padDown = {}; return; }
    let ax = pad.axes[0] || 0;
    if (Math.abs(ax) < 0.3) ax = 0;
    if (pad.buttons[14] && pad.buttons[14].pressed) ax = -1;
    if (pad.buttons[15] && pad.buttons[15].pressed) ax = 1;
    const prevAx = this.padAxis;
    this.padAxis = sign(ax);
    if (this.padAxis !== 0 && this.padAxis !== prevAx) this.tap(this.padAxis > 0 ? 'right' : 'left');
    const az = pad.axes[1] || 0;
    this.padAxisZ = Math.abs(az) < 0.35 ? 0 : sign(az);
    const now = {};
    for (const idx in PAD_BUTTONS) {
      const b = pad.buttons[idx];
      if (b && b.pressed) now[PAD_BUTTONS[idx]] = true;
    }
    for (const a in now) if (!this.padDown[a]) {
      this.pressed[a] = true;
      if (a !== 'pause') this.anyPressed = true;
      Sound.init();
    }
    for (const a in this.padDown) if (!now[a]) this.released[a] = true;
    this.padDown = now;
  },

  isDown(a) { return !!(this.keyDown[a] || this.padDown[a]); },

  // Double-tapping a direction starts a run.
  tap(a) {
    if (a !== 'left' && a !== 'right') return;
    const now = performance.now() / 1000;
    if (now - this.lastTap[a] < PLAYER_CFG.doubleTap) this.doubleTap = a === 'right' ? 1 : -1;
    this.lastTap[a] = now;
  },

  axisZ() {
    const k = (this.isDown('down') ? 1 : 0) - (this.isDown('up') ? 1 : 0);
    if (k !== 0) return k;
    return this.touchAxisZ || this.padAxisZ;
  },

  axisX() {
    const k = (this.keyDown.right ? 1 : 0) - (this.keyDown.left ? 1 : 0);
    if (k !== 0) return k;
    return this.touchAxisX || this.padAxis;
  },

  endStep() {
    for (const k in this.pressed) this.pressed[k] = false;
    for (const k in this.released) this.released[k] = false;
    this.anyPressed = false;
    this.doubleTap = 0;
  },
};

// On-screen touch controls, in view coordinates (1280 x 720).
const TouchLayout = {
  stickR: 80,
  buttons: [
    { action: 'attack', label: 'ATTACK', x: 1112, y: 594, r: 64 },
    { action: 'jump', label: 'JUMP', x: 980, y: 648, r: 46 },
    { action: 'back', label: 'BACK', x: 1214, y: 472, r: 40 },
    { action: 'run', label: 'RUN', x: 986, y: 526, r: 40 },
    { action: 'magic', label: 'MAGIC', x: 1108, y: 446, r: 40 },
    { action: 'pause', label: 'II', x: 1236, y: 44, r: 26 },
    { action: 'rage', label: 'RAGE', x: 1214, y: 346, r: 40, only: 'rageReady' }, // shown when the meter is full
  ],
  rageReady: false,
  shown(b) { return !b.only || this[b.only]; },
  hit(x, y) {
    if (!Input.buttonsLive) return null;
    for (const b of this.buttons) if (this.shown(b) && Math.hypot(x - b.x, y - b.y) <= b.r + 10) return b.action;
    return null;
  },
};

// ---- js/world.js
'use strict';
// The scrolling stage (horizon scenery, floor, foreground) and the shared
// belt-scroller movement routine.

function seededRandom(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const BG_PARALLAX = 0.5;
const FG_PARALLAX = 1.25;

class Stage {
  constructor() {
    this.length = STAGE.length;
    this.door = STAGE.door;
    this.back = [];   // distant silhouettes on the horizon
    this.front = [];  // foreground rocks / grass on the bottom band
    this.marks = [];  // sparse floor marks
    const segs = STAGE.segments;
    for (let i = 0; i < segs.length; i++) {
      const seg = segs[i];
      const end = i + 1 < segs.length ? segs[i + 1].x : this.length;
      const rnd = seededRandom(1000 + i * 77);
      this.buildBack(seg.scenery, seg.x, end, rnd);
      if (seg.scenery !== 'void') this.buildFront(seg.x, end, rnd);
      const density = seg.scenery === 'void' ? 0.15 : 1;
      for (let x = seg.x; x < end; x += 70) {
        if (rnd() > 0.55 * density) continue;
        this.marks.push({ x: x + rnd() * 60, z: 10 + rnd() * (DEPTH - 20), w: 5 + rnd() * 12 });
      }
    }
  }

  buildBack(kind, x0, x1, rnd) {
    // Shapes live in parallax space: visible while the camera is in [x0, x1].
    const p0 = x0 * BG_PARALLAX, p1 = x1 * BG_PARALLAX;
    let x = p0 + rnd() * 80;
    while (x < p1) {
      if (kind === 'plain') {
        if (rnd() < 0.55) this.back.push({ t: 'hill', x, w: 120 + rnd() * 220, h: 14 + rnd() * 30 });
        else this.back.push({ t: 'tree', x, h: 40 + rnd() * 50, s: rnd() });
        x += 90 + rnd() * 200;
      } else if (kind === 'ruins') {
        const r = rnd();
        if (r < 0.5) this.back.push({ t: 'column', x, w: 14 + rnd() * 14, h: 40 + rnd() * 80, s: rnd() });
        else if (r < 0.75) this.back.push({ t: 'arch', x, w: 60 + rnd() * 40, h: 50 + rnd() * 30 });
        else this.back.push({ t: 'block', x, w: 20 + rnd() * 40, h: 8 + rnd() * 16 });
        x += 70 + rnd() * 160;
      } else if (kind === 'fortress') {
        const r = rnd();
        if (r < 0.55) this.back.push({ t: 'wall', x, w: 140 + rnd() * 200, h: 40 + rnd() * 35 });
        else if (r < 0.8) this.back.push({ t: 'tower', x, w: 30 + rnd() * 16, h: 60 + rnd() * 30 });
        else this.back.push({ t: 'spears', x, w: 50 + rnd() * 60, h: 40 + rnd() * 30 });
        x += 60 + rnd() * 150;
      } else {
        // the void: nearly nothing, one thin distant spire now and then
        if (rnd() < 0.3) this.back.push({ t: 'spire', x, h: 30 + rnd() * 60 });
        x += 500 + rnd() * 600;
      }
    }
  }

  buildFront(x0, x1, rnd) {
    const p0 = x0 * FG_PARALLAX, p1 = x1 * FG_PARALLAX + 900;
    let x = p0 + rnd() * 200;
    while (x < p1) {
      this.front.push({ t: rnd() < 0.6 ? 'tuft' : 'rock', x, w: 16 + rnd() * 40, h: 6 + rnd() * 18 });
      x += 160 + rnd() * 400;
    }
  }

  // Distant structures: outlined shapes standing on the horizon.
  drawBack(ctx, camX, viewW, time) {
    ctx.strokeStyle = INK;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    const off = camX * (1 - BG_PARALLAX);
    const lo = camX * BG_PARALLAX - 400, hi = camX * BG_PARALLAX + viewW + 400;
    for (const s of this.back) {
      if (s.x < lo || s.x > hi) continue;
      const x = s.x + off, b = FLOOR_Y;
      switch (s.t) {
        case 'hill':
          ctx.beginPath();
          ctx.ellipse(x, b, s.w / 2, s.h, 0, Math.PI, 0);
          finish(ctx);
          break;
        case 'tree':
          limb(ctx, x, b, x + 2, b - s.h, 5);
          limb(ctx, x + 1, b - s.h * 0.55, x - 12 - s.s * 8, b - s.h * 0.8, 3);
          limb(ctx, x + 2, b - s.h * 0.75, x + 14 + s.s * 6, b - s.h - 6, 3);
          break;
        case 'column': {
          const top = b - s.h;
          ctx.beginPath();
          ctx.moveTo(x, b); ctx.lineTo(x, top + 6);
          ctx.lineTo(x + s.w * 0.4, top - 4 * s.s); ctx.lineTo(x + s.w * 0.7, top + 8);
          ctx.lineTo(x + s.w, top + 2); ctx.lineTo(x + s.w, b);
          ctx.closePath();
          finish(ctx);
          box(ctx, x - 4, b - 6, s.w + 8, 6);
          break;
        }
        case 'arch':
          ctx.beginPath();
          ctx.moveTo(x, b);
          ctx.lineTo(x, b - s.h);
          ctx.arc(x + s.w / 2, b - s.h, s.w / 2, Math.PI, 0);
          ctx.lineTo(x + s.w, b);
          ctx.lineTo(x + s.w - 14, b);
          ctx.lineTo(x + s.w - 14, b - s.h);
          ctx.arc(x + s.w / 2, b - s.h, s.w / 2 - 14, 0, Math.PI, true);
          ctx.lineTo(x + 14, b);
          ctx.closePath();
          finish(ctx);
          break;
        case 'block':
          box(ctx, x, b - s.h, s.w, s.h);
          break;
        case 'wall': {
          // one outline, crenellations included
          const top = b - s.h;
          ctx.beginPath();
          ctx.moveTo(x, b);
          ctx.lineTo(x, top - 8);
          let cx = x;
          while (cx + 16 < x + s.w) {
            ctx.lineTo(cx + 9, top - 8); ctx.lineTo(cx + 9, top);
            ctx.lineTo(cx + 16, top); ctx.lineTo(cx + 16, top - 8);
            cx += 16;
          }
          ctx.lineTo(x + s.w, top - 8);
          ctx.lineTo(x + s.w, b);
          ctx.closePath();
          finish(ctx);
          break;
        }
        case 'tower': {
          const top = b - s.h, mid = x + s.w / 2;
          box(ctx, x, top, s.w, s.h);
          ctx.beginPath();
          ctx.moveTo(x - 6, top); ctx.lineTo(mid, top - 30); ctx.lineTo(x + s.w + 6, top);
          ctx.closePath();
          finish(ctx);
          limb(ctx, mid, top - 30, mid, top - 50, 2);
          ctx.beginPath();
          ctx.moveTo(mid, top - 50);
          ctx.lineTo(mid + 12 + Math.sin(time * 3 + s.x) * 2, top - 46);
          ctx.lineTo(mid, top - 42);
          ctx.closePath();
          finish(ctx);
          // a slit window
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(mid, top + 12); ctx.lineTo(mid, top + 24);
          ctx.stroke();
          break;
        }
        case 'spears':
          for (let k = 0; k < s.w; k += 9) {
            const lean = Math.sin(k * 1.7 + s.x) * 3;
            limb(ctx, x + k, b, x + k + lean, b - s.h, 2);
          }
          break;
        case 'spire':
          ctx.beginPath();
          ctx.moveTo(x - 3, b); ctx.lineTo(x, b - s.h); ctx.lineTo(x + 3, b);
          ctx.closePath();
          finish(ctx);
          break;
      }
    }
    // horizon
    ctx.fillStyle = INK;
    ctx.fillRect(camX - 50, FLOOR_Y - 1, viewW + 100, 2);
  }

  drawFloor(ctx, camX, viewW) {
    ctx.fillStyle = INK;
    for (const m of this.marks) {
      if (m.x < camX - 40 || m.x > camX + viewW + 40) continue;
      const k = m.z / DEPTH; // marks get a little heavier toward the front
      ctx.fillRect(m.x, FLOOR_Y + m.z, m.w * (0.7 + k * 0.6), 1 + k);
    }
  }

  // The near edge of the road: a ledge line with outlined rocks and grass.
  drawFront(ctx, camX, viewW, bottomY) {
    const top = FLOOR_Y + DEPTH + 26;
    ctx.fillStyle = PAPER;
    ctx.fillRect(camX - 50, top, viewW + 100, bottomY - top + 50);
    ctx.fillStyle = INK;
    ctx.fillRect(camX - 50, top - 1, viewW + 100, 2.5);
    ctx.strokeStyle = INK;
    ctx.lineJoin = 'round';
    const off = camX * (1 - FG_PARALLAX);
    const lo = camX * FG_PARALLAX - 200, hi = camX * FG_PARALLAX + viewW + 200;
    for (const f of this.front) {
      if (f.x < lo || f.x > hi) continue;
      const x = f.x + off;
      ctx.beginPath();
      if (f.t === 'tuft') {
        ctx.moveTo(x, top);
        ctx.lineTo(x + f.w * 0.2, top - f.h);
        ctx.lineTo(x + f.w * 0.35, top - f.h * 0.3);
        ctx.lineTo(x + f.w * 0.55, top - f.h * 1.2);
        ctx.lineTo(x + f.w * 0.7, top - f.h * 0.4);
        ctx.lineTo(x + f.w * 0.85, top - f.h * 0.8);
        ctx.lineTo(x + f.w, top);
      } else {
        ctx.ellipse(x + f.w / 2, top, f.w / 2, f.h, 0, Math.PI, 0);
      }
      finish(ctx);
    }
  }
}

// ---------------------------------------------------------------- platforms
// Semisolid ledges: you land on them from above and jump up through them.
// Power blocks are small platforms too (you can stand on them).
let PLATFORMS = [];

class Platform {
  constructor(d) {
    this.d = d;
    this.x = d.x; this.w = d.w; this.z0 = d.z0; this.z1 = d.z1; this.h = d.h;
    this.baseX = d.x; this.baseH = d.h;
    this.dx = 0; this.dh = 0; this.t = 0;
    this.block = null;
    this.fade = 1;
  }
  get z() { return this.z0 - 3; }  // just behind its back edge: draw order among actors

  update(dt) {
    const m = this.d.move;
    if (!m) { this.dx = 0; this.dh = 0; return; }
    this.t += dt;
    const off = Math.sin(this.t * m.speed) * m.range * 0.5;
    const px = this.x, ph = this.h;
    if (m.axis === 'x') this.x = this.baseX + m.range * 0.5 + off;
    else this.h = this.baseH + m.range * 0.5 + off;
    this.dx = this.x - px; this.dh = this.h - ph;
  }

  contains(x0, x1, z) { return x1 > this.x && x0 < this.x + this.w && z >= this.z0 - 2 && z <= this.z1 + 2; }

  drawShadow(ctx) {
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.12;
    ctx.fillRect(this.x + 4, FLOOR_Y + this.z0 + 4, this.w - 8, this.z1 - this.z0 - 4);
    ctx.globalAlpha = 1;
  }

  draw(ctx) {
    if (this.block) { this.block.draw(ctx); return; }
    const top = FLOOR_Y - this.h, x = this.x, w = this.w;
    ctx.save();
    ctx.globalAlpha *= this.fade;
    const zb = top + this.z0, zf = top + this.z1;
    ctx.lineJoin = 'miter';
    if (this.d.posts) {
      // legs down to the floor at the front corners
      limb(ctx, x + 10, zf + 12, x + 10, FLOOR_Y + this.z1, 6);
      limb(ctx, x + w - 10, zf + 12, x + w - 10, FLOOR_Y + this.z1, 6);
    }
    // top face (seen from above at the road's angle) and front face
    box(ctx, x, zb, w, zf - zb);
    box(ctx, x, zf, w, 12);
    // rivets on the front, a seam on the top: a little machined, a little ruined
    ctx.fillStyle = INK;
    for (let k = x + 8; k < x + w - 4; k += 18) ctx.fillRect(k, zf + 5, 2.5, 2.5);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 6, zb + (zf - zb) * 0.5); ctx.lineTo(x + w - 6, zb + (zf - zb) * 0.5);
    ctx.stroke();
    if (this.d.move) {
      // chevrons show which way it travels
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const cx = x + w / 2, cy = zf + 6;
      if (this.d.move.axis === 'x') { ctx.moveTo(cx - 14, cy - 3); ctx.lineTo(cx - 19, cy); ctx.lineTo(cx - 14, cy + 3); ctx.moveTo(cx + 14, cy - 3); ctx.lineTo(cx + 19, cy); ctx.lineTo(cx + 14, cy + 3); }
      else { ctx.moveTo(cx - 4, cy - 1); ctx.lineTo(cx, cy - 4); ctx.lineTo(cx + 4, cy - 1); ctx.moveTo(cx - 4, cy + 2); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx + 4, cy + 2); }
      ctx.stroke();
    }
    ctx.restore();
  }

  // Fades out while it hides the given actor standing behind it.
  updateFade(a, dt) {
    const top = FLOOR_Y + this.z0 - this.h, bottom = FLOOR_Y + this.z1 - this.h + 12;
    const feet = FLOOR_Y + a.z + a.y + a.h, head = feet - a.h;
    const hidden = a.z < this.z0 - 3 && a.x + a.w > this.x && a.x < this.x + this.w && feet > top && head < bottom;
    this.fade = approach(this.fade, hidden ? 0.35 : 1, dt * 4);
  }
}

// A power block: hit it from below or strike it and it gives up its powerup.
class PowerBlock {
  constructor(d) {
    this.d = d;
    this.x = d.x - 13; this.w = 26; this.zc = d.z; this.h = d.h; this.size = 24;
    this.used = false; this.bounce = 0; this.item = d.item;
    this.plat = new Platform({ x: this.x, w: this.w, z0: d.z - 12, z1: d.z + 12, h: d.h + this.size });
    this.plat.block = this;
  }

  draw(ctx) {
    const lift = Math.sin(Math.min(1, this.bounce) * Math.PI) * 8;
    const x = this.x, top = FLOOR_Y + this.zc - this.h - this.size - lift;
    ctx.lineJoin = 'miter';
    // front face and a sliver of top
    box(ctx, x, top + 6, this.w, this.size);
    ctx.beginPath();
    ctx.moveTo(x, top + 6); ctx.lineTo(x + 5, top); ctx.lineTo(x + this.w + 5, top); ctx.lineTo(x + this.w, top + 6);
    ctx.closePath();
    finish(ctx);
    ctx.fillStyle = INK;
    if (!this.used) {
      // a four-point star: something is inside
      const cx = x + this.w / 2, cy = top + 6 + this.size / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 8); ctx.lineTo(cx + 2.5, cy - 2.5); ctx.lineTo(cx + 8, cy); ctx.lineTo(cx + 2.5, cy + 2.5);
      ctx.lineTo(cx, cy + 8); ctx.lineTo(cx - 2.5, cy + 2.5); ctx.lineTo(cx - 8, cy); ctx.lineTo(cx - 2.5, cy - 2.5);
      ctx.closePath();
      ctx.fill();
    } else {
      // spent: rivets only
      ctx.fillRect(x + 4, top + 10, 2.5, 2.5); ctx.fillRect(x + this.w - 6.5, top + 10, 2.5, 2.5);
      ctx.fillRect(x + 4, top + this.size + 1, 2.5, 2.5); ctx.fillRect(x + this.w - 6.5, top + this.size + 1, 2.5, 2.5);
    }
    // its shadow on the floor
    ctx.globalAlpha = 0.18;
    ctx.beginPath();
    ctx.ellipse(x + this.w / 2, FLOOR_Y + this.zc, 14, 3, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// Height of the highest platform top under (x, z) that is at or below `elev`.
function groundUnder(x0, x1, z, elev) {
  let g = 0;
  for (let i = 0; i < PLATFORMS.length; i++) {
    const p = PLATFORMS[i];
    if (p.h <= elev + 0.5 && p.h > g && p.contains(x0, x1, z)) g = p.h;
  }
  return g;
}

// Moves an actor on the floor plane; handles gravity, landing on the floor or
// on a platform (and riding a moving one), and bounds.
function moveActor(a, dt, minX, maxX, gravity, noPlatforms) {
  // ride the platform we're standing on
  if (a.plat && a.onGround) { a.x += a.plat.dx; a.y -= a.plat.dh; }
  if (gravity) a.vy = Math.min(a.vy + GRAVITY * dt, 1150);
  a.hitWall = 0;
  a.x += a.vx * dt;
  if (a.x < minX) { a.x = minX; a.hitWall = -1; if (a.vx < 0) a.vx = 0; }
  else if (a.x + a.w > maxX) { a.x = maxX - a.w; a.hitWall = 1; if (a.vx > 0) a.vx = 0; }
  a.z += a.vz * dt;
  if (a.z < 0) { a.z = 0; if (a.vz < 0) a.vz = 0; }
  else if (a.z > DEPTH) { a.z = DEPTH; if (a.vz > 0) a.vz = 0; }
  const prevElev = -(a.y + a.h);
  a.y += a.vy * dt;
  const elev = -(a.y + a.h);
  a.onGround = false;
  a.plat = null;
  if (!noPlatforms && a.vy >= 0) {
    // land on the highest platform we fell onto (or are standing on)
    let best = null;
    for (let i = 0; i < PLATFORMS.length; i++) {
      const p = PLATFORMS[i];
      if (prevElev >= p.h - 1.5 && elev <= p.h && p.contains(a.x, a.x + a.w, a.z) && (!best || p.h > best.h)) best = p;
    }
    if (best) {
      a.y = -best.h - a.h;
      a.vy = 0;
      a.onGround = true;
      a.plat = best;
      return;
    }
  }
  if (a.y + a.h >= 0) {
    a.y = -a.h;
    if (a.vy > 0) a.vy = 0;
    a.onGround = true;
  }
}

// Melee connection test in belt-scroller space.
function hitsActor(box, depthTol, attackerZ, target) {
  return Math.abs(attackerZ - target.z) <= depthTol && rectsOverlap(box, target);
}

function drawShadow(ctx, a) {
  ctx.fillStyle = INK;
  const elev = -(a.y + a.h);
  const g = groundUnder(a.x, a.x + a.w, a.z, elev);
  const k = clamp(1 - (elev - g) / 260, 0.3, 1);
  ctx.beginPath();
  ctx.ellipse(a.x + a.w / 2, FLOOR_Y + a.z - g, (a.w * 0.6 + 6) * k, 3.2 * k, 0, 0, TAU);
  ctx.fill();
}

<script>
// ---- js/fx.js
'use strict';
// Monochrome visual effects: particles, sword slashes, rings, dash ghosts,
// screen shake and hit-stop. Everything is pooled.

const FX = {
  particles: new Pool(() => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 3, white: false, grav: 0, drag: 0, streak: false }), 600),
  slashes: new Pool(() => ({ active: false, owner: null, facing: 1, a0: 0, a1: 0, t: 0, dur: 0.1, thick: 20, r: 100 }), 16),
  rings: new Pool(() => ({ active: false, x: 0, y: 0, r0: 0, r1: 0, t: 0, dur: 0.3, white: false, width: 3, fill: false }), 40),
  ghosts: new Pool(() => ({ active: false, t: 0, dur: 0.2, pose: { x: 0, y: 0, facing: 1, sword: 0, legA: 0, legB: 0, lean: 0, sx: 1, sy: 1, cloak: 0, time: 0 } }), 24),
  trauma: 0,

  clear() {
    this.particles.clear(); this.slashes.clear(); this.rings.clear(); this.ghosts.clear();
    this.trauma = 0;
  },

  shake(amount) { this.trauma = Math.min(0.8, this.trauma + amount); },

  particle(x, y, vx, vy, life, size, white, grav, drag, streak) {
    const p = this.particles.obtain();
    if (!p) return;
    p.active = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
    p.life = p.max = life; p.size = size; p.white = !!white;
    p.grav = grav || 0; p.drag = drag || 0; p.streak = !!streak;
  },

  // Radial burst. dir (-1/1/0) biases the spray horizontally.
  burst(x, y, n, speed, opts) {
    const o = opts || {};
    for (let i = 0; i < n; i++) {
      let a = Math.random() * TAU;
      if (o.dir) a = (o.dir > 0 ? 0 : Math.PI) + rand(-o.spread || -0.9, o.spread || 0.9);
      if (o.up) a = -Math.PI / 2 + rand(-o.up, o.up);
      const s = speed * rand(0.35, 1);
      this.particle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.25, 0.6) * (o.life || 1),
        rand(2, 5) * (o.size || 1), o.white, o.grav === undefined ? 900 : o.grav, o.drag || 2, o.streak);
    }
  },

  dust(x, y, n, dir) {
    for (let i = 0; i < n; i++) {
      const vx = (dir ? dir * rand(40, 220) : rand(-200, 200));
      this.particle(x + rand(-8, 8), y - rand(0, 4), vx, -rand(20, 140), rand(0.2, 0.45), rand(2, 4), false, 300, 4);
    }
  },

  ring(x, y, r0, r1, dur, white, width, fill) {
    const r = this.rings.obtain();
    if (!r) return;
    r.active = true; r.x = x; r.y = y; r.r0 = r0; r.r1 = r1; r.t = 0; r.dur = dur;
    r.white = !!white; r.width = width || 3; r.fill = !!fill;
  },

  // A crescent swept behind a blade. `sweep`/`dur` default to the attack's own.
  slash(owner, atk, sweep, dur) {
    const s = this.slashes.obtain();
    if (!s) return;
    const sw = sweep || atk.sweep;
    s.active = true; s.owner = owner; s.facing = owner.facing;
    s.a0 = sw[0]; s.a1 = sw[1];
    s.t = 0; s.dur = dur || atk.active; s.thick = atk.thickness;
    s.r = atk.slashR || PLAYER_CFG.bladeLength + 22;
  },

  ghost(pose) {
    const g = this.ghosts.obtain();
    if (!g) return;
    g.active = true; g.t = 0; g.dur = 0.22;
    Object.assign(g.pose, pose);
  },

  update(dt) {
    this.trauma = Math.max(0, this.trauma - dt * 1.8);
    const ps = this.particles.items;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) { p.active = false; continue; }
      p.vy += p.grav * dt;
      const d = 1 / (1 + p.drag * dt);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    const ss = this.slashes.items;
    for (let i = 0; i < ss.length; i++) {
      const s = ss[i];
      if (!s.active) continue;
      s.t += dt;
      if (s.t > s.dur + 0.14) s.active = false;
    }
    const rs = this.rings.items;
    for (let i = 0; i < rs.length; i++) {
      const r = rs[i];
      if (!r.active) continue;
      r.t += dt;
      if (r.t >= r.dur) r.active = false;
    }
    const gs = this.ghosts.items;
    for (let i = 0; i < gs.length; i++) {
      const g = gs[i];
      if (!g.active) continue;
      g.t += dt;
      if (g.t >= g.dur) g.active = false;
    }
  },

  drawBack(ctx) {
    const gs = this.ghosts.items;
    for (let i = 0; i < gs.length; i++) {
      const g = gs[i];
      if (!g.active) continue;
      ctx.globalAlpha = 0.28 * (1 - g.t / g.dur);
      drawFigure(ctx, g.pose, false);
    }
    ctx.globalAlpha = 1;
  },

  drawFront(ctx) {
    // sword slashes: a crescent swept behind the blade, thickest at its leading edge
    const ss = this.slashes.items;
    for (let i = 0; i < ss.length; i++) {
      const s = ss[i];
      if (!s.active) continue;
      const o = s.owner;
      const prog = Math.min(1, s.t / s.dur);
      const fade = s.t > s.dur ? 1 - (s.t - s.dur) / 0.14 : 1;
      const aEnd = lerp(s.a0, s.a1, easeOutCubic(prog));
      const aStart = lerp(s.a0, aEnd, s.t > s.dur ? (s.t - s.dur) / 0.14 : 0);
      ctx.save();
      ctx.translate(o.x + o.w / 2 + s.facing * 3, FLOOR_Y + o.z + o.y + o.h - 34);
      ctx.scale(s.facing, 1);
      ctx.globalAlpha = 0.9 * fade;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      const N = 18;
      for (let k = 0; k <= N; k++) {
        const a = lerp(aStart, aEnd, k / N);
        ctx.lineTo(Math.cos(a) * s.r, Math.sin(a) * s.r);
      }
      for (let k = N; k >= 0; k--) {
        const f = k / N;
        const a = lerp(aStart, aEnd, f);
        const r = s.r - s.thick * Math.pow(f, 1.6) - 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      if (s.thick >= 36) {
        // heavy swing gets an outer echo line
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000';
        ctx.beginPath();
        const a0 = lerp(aStart, aEnd, 0.25);
        ctx.arc(0, 0, s.r + 12, Math.min(a0, aEnd), Math.max(a0, aEnd));
        ctx.stroke();
      }
      ctx.restore();
    }

    const ps = this.particles.items;
    ctx.fillStyle = '#000';
    for (let pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass === 0 ? '#000' : '#fff';
      ctx.strokeStyle = ctx.fillStyle;
      for (let i = 0; i < ps.length; i++) {
        const p = ps[i];
        if (!p.active || p.white !== (pass === 1)) continue;
        const k = p.life / p.max;
        const sz = p.size * (0.4 + 0.6 * k);
        if (p.streak) {
          ctx.lineWidth = sz * 0.7;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
          ctx.stroke();
        } else {
          ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
        }
      }
    }

    const rs = this.rings.items;
    for (let i = 0; i < rs.length; i++) {
      const r = rs[i];
      if (!r.active) continue;
      const k = r.t / r.dur;
      const rad = lerp(r.r0, r.r1, easeOutCubic(k));
      ctx.globalAlpha = 1 - k;
      ctx.beginPath();
      ctx.arc(r.x, r.y, Math.max(0.1, rad), 0, TAU);
      if (r.fill) {
        ctx.fillStyle = r.white ? '#fff' : '#000';
        ctx.fill();
      } else {
        ctx.lineWidth = r.width * (1 - k * 0.6);
        ctx.strokeStyle = r.white ? '#fff' : '#000';
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  },
};

<script>
// ---- js/player.js
'use strict';
// The player: an outlined figure of one of three classes - the Warrior with an
// enormous sword, the Archer with a bow, the Rogue with twin daggers.

const SWORD_REST = -2.35; // warrior: blade resting up-and-back over the shoulder

// ---------------------------------------------------------------- figure drawing
// Local space faces right, origin at the feet. P carries the pose:
//   legs, lean, squash, cloak, weapon ('sword' | 'bow' | 'daggers'),
//   sword (main weapon angle), sword2 (second dagger), draw (bowstring 0..1), fire.
function drawFigure(ctx, P, showEye) {
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.scale(P.facing * P.sx, P.sy);
  ctx.rotate(P.lean);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const weapon = P.weapon || 'sword';

  // legs
  const hipY = -18;
  limb(ctx, 0, hipY, Math.sin(P.legB) * 18, hipY + Math.cos(P.legB) * 18, 6);
  limb(ctx, 0, hipY, Math.sin(P.legA) * 18, hipY + Math.cos(P.legA) * 18, 6);

  const c = P.cloak;
  const wig = Math.sin(P.time * 13) * 3 * (0.3 + c);
  if (weapon === 'sword') {
    // cloak tail streaming behind
    ctx.beginPath();
    ctx.moveTo(1, -39);
    ctx.lineTo(-3, -24);
    ctx.lineTo(-14 - 16 * c, -22 + 4 * c + wig);
    ctx.lineTo(-8 - 6 * c, -32 + wig * 0.4);
    ctx.closePath();
    finish(ctx);
  } else if (weapon === 'bow') {
    // quiver slung across the back, fletchings showing
    ctx.save();
    ctx.translate(-6, -30);
    ctx.rotate(-0.4);
    box(ctx, -3.5, -14, 7, 18);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-2, -14); ctx.lineTo(-3, -20);
    ctx.moveTo(1, -14); ctx.lineTo(1, -21);
    ctx.moveTo(3, -14); ctx.lineTo(4, -19);
    ctx.stroke();
    ctx.restore();
  }

  // outlined wings while flying (Rogue's power)
  if (P.wings) {
    const f = Math.sin(P.wings * 22);
    for (const [len, sway] of [[30, 0], [24, 0.35]]) {
      ctx.beginPath();
      ctx.moveTo(-2, -34);
      ctx.lineTo(-len, -44 - f * 12 + sway * 10);
      ctx.lineTo(-len * 0.7, -36 - f * 6);
      ctx.lineTo(-len * 0.9, -30 - f * 4 + sway * 6);
      ctx.lineTo(-4, -28);
      ctx.closePath();
      finish(ctx);
    }
  }

  // torso
  limb(ctx, 0, hipY, 2, -35, weapon === 'daggers' ? 10 : 12);

  // head (+ hood / headband)
  if (weapon === 'bow') {
    ctx.beginPath();
    ctx.moveTo(-1, -55); ctx.lineTo(-11, -38 + wig * 0.3); ctx.lineTo(3, -38);
    ctx.closePath();
    finish(ctx);
  }
  ctx.beginPath();
  ctx.arc(4, -45, 8, 0, TAU);
  finish(ctx);
  if (weapon === 'bow') {
    // hood brim over the brow
    ctx.lineWidth = OUTLINE;
    ctx.beginPath();
    ctx.arc(4, -45, 8, -2.6, -0.35);
    ctx.lineTo(13, -46);
    ctx.stroke();
  } else if (weapon === 'daggers') {
    // headband with two tails
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-3, -48); ctx.lineTo(11, -48);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-3, -48);
    ctx.quadraticCurveTo(-10, -48 + wig, -17 - 8 * c, -44 + wig * 1.5);
    ctx.moveTo(-3, -47);
    ctx.quadraticCurveTo(-9, -44 - wig, -14 - 7 * c, -39 - wig);
    ctx.stroke();
  }
  if (showEye) eye(ctx, 7, -47, 4, 2);

  if (weapon === 'bow') drawBow(ctx, P);
  else if (weapon === 'daggers') drawDaggers(ctx, P);
  else drawSword(ctx, P.sword);

  ctx.restore();
}

function drawSword(ctx, a) {
  const dx = Math.cos(a), dy = Math.sin(a);
  const nx = -dy, ny = dx;
  const shx = 3, shy = -34;
  const hx = shx + dx * 15, hy = shy + dy * 15;
  limb(ctx, shx, shy, hx, hy, 3);
  limb(ctx, shx - 2, shy + 1, hx - dx * 5, hy - dy * 5, 3);
  const L = PLAYER_CFG.bladeLength;
  const bx = hx + dx * 8, by = hy + dy * 8;
  const w0 = 6.5;
  ctx.beginPath();
  ctx.moveTo(bx + nx * w0, by + ny * w0);
  ctx.lineTo(bx + dx * L * 0.8 + nx * w0 * 0.95, by + dy * L * 0.8 + ny * w0 * 0.95);
  ctx.lineTo(bx + dx * L, by + dy * L);
  ctx.lineTo(bx + dx * L * 0.8 - nx * w0 * 0.6, by + dy * L * 0.8 - ny * w0 * 0.6);
  ctx.lineTo(bx - nx * w0, by - ny * w0);
  ctx.closePath();
  finish(ctx);
  // fuller: the groove down the middle of the blade
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(bx + dx * 4, by + dy * 4);
  ctx.lineTo(bx + dx * L * 0.72, by + dy * L * 0.72);
  ctx.stroke();
  // guard, grip, pommel
  limb(ctx, hx + dx * 7 + nx * 12, hy + dy * 7 + ny * 12, hx + dx * 7 - nx * 12, hy + dy * 7 - ny * 12, 6);
  limb(ctx, hx - dx * 7, hy - dy * 7, hx + dx * 5, hy + dy * 5, 5);
  ctx.beginPath();
  ctx.arc(hx - dx * 9, hy - dy * 9, 3.5, 0, TAU);
  finish(ctx);
}

// A recurve bow held out along the aim angle, string pulled back by P.draw.
function drawBow(ctx, P) {
  const a = P.sword, draw = P.draw || 0;
  const dx = Math.cos(a), dy = Math.sin(a);
  const shx = 3, shy = -34;
  const hx = shx + dx * 17, hy = shy + dy * 17;
  const R = 22, span = 1.15;
  const cx = hx - dx * 8, cy = hy - dy * 8;
  const t1x = cx + Math.cos(a - span) * R, t1y = cy + Math.sin(a - span) * R;
  const t2x = cx + Math.cos(a + span) * R, t2y = cy + Math.sin(a + span) * R;
  const chord = R * Math.cos(span);
  const mx = cx + dx * (chord - draw * 17), my = cy + dy * (chord - draw * 17);
  // string (behind the bow limbs)
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(t1x, t1y); ctx.lineTo(mx, my); ctx.lineTo(t2x, t2y);
  ctx.stroke();
  // arms: bow hand forward, string hand at the nock
  limb(ctx, shx, shy, hx, hy, 3);
  limb(ctx, shx - 2, shy + 1, mx, my, 3);
  // the bow: an outlined curved limb
  ctx.beginPath();
  ctx.arc(cx, cy, R, a - span, a + span);
  ctx.lineWidth = 4.5;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = inkFlash ? INK : PAPER;
  ctx.stroke();
  ctx.strokeStyle = INK;
  box(ctx, hx - 2.5 - dx * 1, hy - 2.5 - dy * 1, 5, 5); // grip
  // nocked arrow while drawing
  if (draw > 0.05) {
    const tipx = mx + dx * 34, tipy = my + dy * 34;
    drawArrowShape(ctx, mx, my, tipx, tipy, P.fire, P.time);
  }
}

// Shaft + head + fletching; a fire arrow burns at the tip.
function drawArrowShape(ctx, x0, y0, x1, y1, fire, time) {
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * 5, y1 - uy * 5);
  ctx.moveTo(x0 + ux * 4, y0 + uy * 4); ctx.lineTo(x0 - ux * 1 + nx * 4, y0 - uy * 1 + ny * 4);
  ctx.moveTo(x0 + ux * 4, y0 + uy * 4); ctx.lineTo(x0 - ux * 1 - nx * 4, y0 - uy * 1 - ny * 4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * 7 + nx * 3.5, y1 - uy * 7 + ny * 3.5);
  ctx.lineTo(x1 - ux * 7 - nx * 3.5, y1 - uy * 7 - ny * 3.5);
  ctx.closePath();
  finish(ctx);
  if (fire) drawFlames(ctx, x1 - ux * 4, y1 - uy * 4 + 2, time || 0, 7, 3);
}

// Two short blades, one per hand (P.sword, P.sword2).
function drawDaggers(ctx, P) {
  const one = (sx, sy, a, len) => {
    const dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
    const hx = sx + dx * 13, hy = sy + dy * 13;
    limb(ctx, sx, sy, hx, hy, 3);
    const bx = hx + dx * 4, by = hy + dy * 4;
    ctx.beginPath();
    ctx.moveTo(bx + nx * 3, by + ny * 3);
    ctx.lineTo(bx + dx * len, by + dy * len);
    ctx.lineTo(bx - nx * 3, by - ny * 3);
    ctx.closePath();
    finish(ctx);
    limb(ctx, hx + dx * 3 + nx * 6, hy + dy * 3 + ny * 6, hx + dx * 3 - nx * 6, hy + dy * 3 - ny * 6, 3);
  };
  one(1, -33, P.sword2 === undefined ? 1.45 : P.sword2, 24);
  one(3, -34, P.sword, 26);
}

// Outlined flame tongues flickering upward from (x, y).
function drawFlames(ctx, x, y, time, size, count) {
  for (let i = 0; i < count; i++) {
    const off = (i - (count - 1) / 2) * size * 0.8;
    const h = size * (1.6 + 0.6 * Math.sin(time * 23 + i * 2.1));
    const sway = Math.sin(time * 17 + i * 3.3) * size * 0.35;
    const bx = x + off, w = size * 0.55;
    ctx.beginPath();
    ctx.moveTo(bx - w, y);
    ctx.quadraticCurveTo(bx - w, y - h * 0.5, bx + sway, y - h);
    ctx.quadraticCurveTo(bx + w, y - h * 0.5, bx + w, y);
    ctx.quadraticCurveTo(bx, y + w * 0.6, bx - w, y);
    ctx.closePath();
    finish(ctx);
  }
}

function drawFigureBodyOnly(ctx, P) {
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.scale(P.facing * P.sx, P.sy);
  ctx.rotate(P.lean);
  limb(ctx, 0, -18, Math.sin(P.legB) * 18, -18 + Math.cos(P.legB) * 18, 6);
  limb(ctx, 0, -18, Math.sin(P.legA) * 18, -18 + Math.cos(P.legA) * 18, 6);
  limb(ctx, 0, -18, 2, -35, 12);
  ctx.beginPath(); ctx.arc(6, -43, 8, 0, TAU); finish(ctx);
  limb(ctx, 3, -34, 16, -20, 3);
  ctx.restore();
}

// ---------------------------------------------------------------- the player
class Player {
  constructor(game) {
    this.g = game;
    this.hitBox = Rect();
    this.pose = { x: 0, y: 0, facing: 1, sword: SWORD_REST, sword2: 1.45, draw: 0, fire: false, weapon: 'sword',
      legA: 0, legB: 0, lean: 0, sx: 1, sy: 1, cloak: 0, time: 0 };
    this.setClass('warrior');
    this.reset(200, DEPTH / 2);
  }

  setClass(key) {
    this.cls = CLASSES[key] || CLASSES.warrior;
    this.stats = Object.assign({}, PLAYER_CFG, this.cls.stats);
    this.maxHp = this.stats.maxHp;
  }

  reset(x, z) {
    const c = this.stats;
    this.w = c.w; this.h = c.h;
    this.x = x - c.w / 2; this.y = -c.h; this.z = z;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.facing = 1;
    this.hp = this.maxHp;
    this.lives = c.lives;
    this.pots = c.startPots;
    this.alive = true;
    this.state = 'normal';
    this.t = 0;
    this.onGround = true; this.hitWall = 0;
    this.jumpBuf = 0; this.atkBuf = 0; this.backBuf = 0; this.magicBuf = 0; this.dashBuf = 0;
    this.invuln = 0;
    this.running = false; this.runDir = 0;
    this.airAttacks = 0;
    this.combo = 0; this.comboT = 0;
    this.atk = null; this.atkPhase = ''; this.atkT = 0; this.atkFrom = this.cls.rest;
    this.attackId = 0; this.hitActive = false; this.hitIdx = 0; this.hitEnd = 0;
    this.grabbed = null; this.knees = 0; this.kneeT = 0;
    this.hitCount = 0; this.hitCountT = 0;
    this.lying = false; this.downT = 0;
    this.dashCd = 0; this.airDash = true; this.dashVX = 0; this.dashVZ = 0; this.strikeT = 0;
    this.runPhase = 0; this.squash = 0; this.ghostT = 0;
    this.deathT = 0; this.reported = false;
    this.control = true; this.speedMul = 1;
    this.rage = 0; this.rageT = 0;
    this.barrier = 0; this.barrierT = 0;
    this.power = null; this.powerT = 0; this.fuel = 0; this.flying = false;
    this.plat = null;
    this.time = 0;
  }

  place(x, z) {
    this.x = x - this.w / 2; this.z = z; this.y = -this.h;
    this.vx = 0; this.vy = 0; this.vz = 0;
  }

  get cx() { return this.x + this.w / 2; }
  get bottom() { return this.y + this.h; }
  get screenY() { return FLOOR_Y + this.z + this.y + this.h; }
  get invulnerable() {
    const s = this.state;
    return this.invuln > 0 || s === 'down' || s === 'getup' || s === 'magic' || s === 'throw' || s === 'dead' || s === 'dash';
  }

  // Returns true when damage was applied.
  hurt(dmg, fromX, kb, kbUp, knockdown) {
    if (!this.alive || this.invulnerable || this.g.god) return false;
    const dir = this.cx >= fromX ? 1 : -1;
    if (this.barrier > 0) {
      // the force field takes the blow instead
      this.barrier--;
      if (this.barrier <= 0) this.barrierT = 0;
      this.invuln = 0.45;
      FX.ring(this.cx, this.screenY - 25, 20, 60, 0.3, false, 4);
      FX.burst(this.cx, this.screenY - 25, 10, 300, { dir: -dir, streak: true, grav: 0 });
      FX.shake(0.08);
      Sound.block();
      return true;
    }
    const raging = this.rageT > 0;
    if (raging) dmg *= RAGE_CFG.damageTaken;
    this.addRage(dmg * RAGE_CFG.perDamage);
    this.hp = Math.max(0, this.hp - dmg);
    FX.shake(0.2 + dmg / 90);
    FX.burst(this.cx, this.screenY - 25, 14, 380, { dir: dir, spread: 1.2 });
    FX.ring(this.cx, this.screenY - 25, 6, 46, 0.25, false, 4);
    Sound.hurt();
    this.g.onPlayerHurt(dmg);
    if (raging && this.hp > 0) {
      // raging: the hit lands, but nothing stops you
      this.invuln = 0.3;
      return true;
    }
    this.releaseGrab();
    this.atk = null;
    this.hitActive = false;
    this.combo = 0;
    this.running = false;
    this.hitCount++;
    this.hitCountT = 1.2;
    if (this.hp <= 0) { this.die(dir); return true; }
    if (knockdown || this.hitCount >= 3) {
      this.knockDown(dir, kb || 300);
    } else {
      this.state = 'hurt';
      this.t = 0;
      this.vx = dir * (kb || 300) * 0.6;
      this.vz = 0;
      if (!this.onGround) this.vy = kbUp === undefined ? -250 : kbUp * 0.6;
      this.invuln = this.stats.hurtInvuln;
    }
    return true;
  }

  knockDown(dir, kb) {
    this.state = 'down';
    this.t = 0;
    this.hitCount = 0;
    this.lying = false;
    this.downT = 0;
    this.vx = dir * kb * 0.7;
    this.vy = -420;
    this.vz = 0;
    this.onGround = false;
  }

  releaseGrab() {
    if (this.grabbed) {
      const e = this.grabbed;
      this.grabbed = null;
      if (e.active && e.state === 'grabbed') { e.staggerT = 0.3; e.setState('stagger'); }
    }
  }

  die(dir) {
    this.alive = false;
    this.state = 'dead';
    this.deathT = 0;
    this.reported = false;
    this.deathFacing = this.facing;
    this.deathX = this.cx;
    this.deathZ = this.z;
    this.vx = dir * 220;
    this.vy = -320;
    this.vz = 0;
    this.hitActive = false;
    Sound.death();
  }

  // Spend a life: stand back up where you fell, clearing space around you.
  revive() {
    this.alive = true;
    this.hp = this.maxHp;
    this.place(this.deathX, this.deathZ);
    this.state = 'getup';
    this.t = 0;
    this.invuln = 2.2;
    this.hitCount = 0;
  }

  update(dt) {
    const c = this.stats, I = Input, g = this.g;
    this.t += dt;
    this.time += dt;
    this.jumpBuf -= dt; this.atkBuf -= dt; this.backBuf -= dt; this.magicBuf -= dt; this.dashBuf -= dt;
    this.invuln -= dt; this.comboT -= dt; this.hitCountT -= dt; this.dashCd -= dt; this.strikeT -= dt;
    if (this.hitCountT <= 0) this.hitCount = 0;
    this.squash = approach(this.squash, 0, dt * 5);
    const minX = g.cam.x + 6, maxX = g.cam.x + g.viewW - 6;

    if (this.state === 'dead') {
      this.deathT += dt;
      if (this.onGround) this.vx = approach(this.vx, 0, 1600 * dt);
      moveActor(this, dt, minX, maxX, true);
      if (!this.onGround || this.deathT < 0.05) { this.deathX = this.cx; this.deathZ = this.z; }
      if (this.deathT > 0.5 && this.deathT < 1.5 && Math.random() < 0.7) {
        FX.particle(this.deathX + rand(-12, 12), FLOOR_Y + this.deathZ - rand(0, 48), rand(-20, 20), -rand(40, 140), rand(0.6, 1.2), rand(2, 4), false, -60, 1);
      }
      if (this.deathT >= 1.9 && !this.reported) { this.reported = true; g.onPlayerFallen(); }
      return;
    }

    const mx = this.control ? I.axisX() : 0;
    const mz = this.control ? I.axisZ() : 0;
    if (this.control) {
      if (I.pressed.jump) this.jumpBuf = 0.1;
      if (g.combatAllowed) {
        if (I.pressed.attack) this.atkBuf = 0.2;
        if (I.pressed.back) this.backBuf = 0.15;
        if (I.pressed.magic) this.magicBuf = 0.15;
        if (I.pressed.run && this.cls.dash) this.dashBuf = 0.12;
        if (I.pressed.rage) this.startRage();
      }
    }
    this.updateBuffs(dt);

    switch (this.state) {
      case 'normal': this.updateNormal(dt, mx, mz); break;
      case 'attack': this.updateAttack(dt); break;
      case 'dash': this.updateDash(dt); break;
      case 'grab': this.updateGrab(dt, mx); break;
      case 'throw':
        this.vx = approach(this.vx, 0, 2000 * dt);
        if (this.t >= 0.36) this.state = 'normal';
        break;
      case 'hurt':
        this.vx = approach(this.vx, 0, 900 * dt);
        if (this.t >= c.hurtStun && this.onGround) this.state = 'normal';
        break;
      case 'down':
        if (this.lying) {
          this.vx = approach(this.vx, 0, 1400 * dt);
          this.downT += dt;
          if (this.downT >= c.downTime) { this.state = 'getup'; this.t = 0; }
        }
        break;
      case 'getup':
        this.vx = 0; this.vz = 0;
        if (this.t >= c.getupTime) { this.state = 'normal'; this.invuln = Math.max(this.invuln, c.getupInvuln); }
        break;
      case 'magic':
        this.vx = 0; this.vz = 0;
        if (this.t >= MAGIC_CFG.castTime) this.state = 'normal';
        break;
    }

    // air attacks hang for a moment
    if (this.state === 'attack' && this.atk.air && this.atkPhase !== 'recovery' && this.vy > -100) this.vy -= GRAVITY * 0.5 * dt;

    // Rogue flight: hold jump in the air while the power lasts
    this.flying = false;
    if (this.power === 'flight' && this.fuel > 0 && !this.onGround && Input.isDown('jump') && this.control &&
        (this.state === 'normal' || this.state === 'attack')) {
      const F = POWER_CFG.flight;
      const elev = -(this.y + this.h);
      this.vy = approach(this.vy, elev < F.maxHeight ? -F.rise : 0, 3000 * dt) - GRAVITY * dt;
      this.fuel = Math.max(0, this.fuel - dt);
      this.flying = true;
      this.airAttacks = 0;
      if (Math.random() < 0.3) FX.particle(this.cx - this.facing * 10, this.screenY - 30, -this.facing * 40, rand(20, 60), 0.3, 2.5, false, 0, 2);
    }

    const wasGround = this.onGround;
    const fallSpeed = this.vy;
    moveActor(this, dt, minX, maxX, this.state !== 'dash');
    if (this.onGround) {
      this.airAttacks = 0;
      this.airDash = true;
      if (!wasGround) {
        this.squash = clamp(fallSpeed / 1100, 0.2, 1);
        FX.dust(this.cx, this.screenY, 6);
        if (this.state === 'down' && !this.lying) {
          this.lying = true;
          this.downT = 0;
          FX.dust(this.cx, this.screenY, 10);
          FX.shake(0.1);
          Sound.land();
        } else if (fallSpeed > 500) Sound.land();
        if (this.state === 'attack' && this.atk.air) { this.state = 'normal'; this.atk = null; this.hitActive = false; }
      }
    }

    this.runPhase += Math.hypot(this.vx, this.vz) * dt * 0.042;
    if (this.running && this.onGround && Math.random() < 0.3) FX.dust(this.cx - this.facing * 8, this.screenY, 1, -this.facing);

    if (this.hitActive) placeBox(this.hitBox, this.cx, this.bottom, this.atk.box, this.facing);
  }

  updateNormal(dt, mx, mz) {
    const c = this.stats, I = Input;
    // running: double-tap a direction, or hold run (the Rogue's run key dashes instead)
    const holdRun = (!this.cls.dash && I.isDown('run')) || I.touchRun;
    if (I.doubleTap && I.doubleTap === mx) this.running = true;
    if (holdRun && mx !== 0) this.running = true;
    if (mx === 0 || (this.running && mx !== this.runDir && this.runDir !== 0)) this.running = holdRun && mx !== 0;
    this.runDir = this.running ? mx : 0;

    const sm = this.speedMul * (this.rageT > 0 ? RAGE_CFG.speedMul : 1);
    if (this.onGround) {
      const sx = this.running ? c.runSpeed : c.walkSpeed;
      const sz = c.depthSpeed * (this.running ? 0.5 : 1);
      this.vx = approach(this.vx, mx * sx * sm, c.accel * dt);
      this.vz = approach(this.vz, mz * sz * sm, c.accel * dt);
      if (mx) this.facing = mx;
    } else if (this.flying) {
      // in flight you steer freely
      this.vx = approach(this.vx, mx * c.walkSpeed * 1.3 * sm, 1600 * dt);
      this.vz = approach(this.vz, mz * c.depthSpeed * sm, 1200 * dt);
      if (mx) this.facing = mx;
    } else {
      // jumps are committed, with a little steering
      this.vx = approach(this.vx, mx ? mx * Math.max(c.walkSpeed, Math.abs(this.vx)) : this.vx, 700 * dt);
      this.vz = approach(this.vz, mz * c.depthSpeed * 0.6, 500 * dt);
    }

    if (this.dashBuf > 0 && this.dashCd <= 0 && (this.onGround || this.airDash)) {
      this.dashBuf = 0;
      this.startDash(mx, mz);
      return;
    }
    if (this.onGround && (this.backBuf > 0 || (this.jumpBuf > 0 && this.atkBuf > 0))) {
      this.backBuf = 0; this.jumpBuf = 0; this.atkBuf = 0;
      this.beginAttack(this.cls.attacks.back);
      return;
    }
    if (this.onGround && this.magicBuf > 0) {
      this.magicBuf = 0;
      if (this.pots > 0) { this.startMagic(); return; }
    }
    if (this.jumpBuf > 0 && this.onGround) {
      this.vy = -c.jumpVel;
      if (this.running) this.vx = this.facing * c.runSpeed * c.runJumpBoost;
      this.onGround = false;
      this.jumpBuf = 0;
      this.squash = -0.8;
      FX.dust(this.cx, this.screenY, 5);
      Sound.jump();
    }
    if (this.atkBuf > 0) this.startAttack(mx);
  }

  // ------------------------------------------------ the Rogue's evasive dash
  startDash(mx, mz) {
    const d = this.cls.dash;
    let dx = mx, dz = mz;
    if (!dx && !dz) dx = this.facing;
    const len = Math.hypot(dx, dz) || 1;
    this.dashVX = dx / len * d.speed;
    this.dashVZ = dz / len * d.speed * 0.7;
    if (dx) this.facing = dx > 0 ? 1 : -1;
    this.state = 'dash';
    this.t = 0;
    this.dashCd = d.cooldown;
    this.invuln = Math.max(this.invuln, d.invuln);
    if (!this.onGround) this.airDash = false;
    this.vy = 0;
    this.running = false;
    this.atk = null;
    this.hitActive = false;
    this.ghostT = 0;
    FX.dust(this.cx, this.screenY, 5, -this.facing);
    FX.ring(this.cx, this.screenY - 25, 4, 30, 0.2, false, 2);
    Sound.dash();
  }

  updateDash(dt) {
    const d = this.cls.dash;
    this.vx = this.dashVX;
    this.vz = this.dashVZ;
    this.vy = 0;
    this.ghostT -= dt;
    if (this.ghostT <= 0) {
      this.ghostT = 0.028;
      this.computePose();
      FX.ghost(this.pose);
    }
    if (this.atkBuf > 0) {
      // attack out of the dash: the dash twin strike
      this.atkBuf = 0;
      this.beginAttack(this.cls.attacks.dash);
      return;
    }
    if (this.t >= d.time) {
      this.state = 'normal';
      this.vx *= 0.35;
      this.vz *= 0.35;
      this.strikeT = d.strikeWindow;
    }
  }

  startAttack(mx) {
    const c = this.stats;
    this.atkBuf = 0;
    const A = this.cls.attacks;
    if (!this.onGround) {
      if (this.airAttacks >= c.maxAirAttacks) return;
      this.airAttacks++;
      this.beginAttack(A.air);
      return;
    }
    if (this.running || this.strikeT > 0) { this.strikeT = 0; this.beginAttack(A.dash); return; }
    if (mx) this.facing = mx;
    const target = this.g.findGrabTarget(this);
    if (target) { this.startGrab(target); return; }
    if (this.comboT <= 0) this.combo = 0;
    const key = this.combo === 2 ? 'a3' : this.combo === 1 ? 'a2' : 'a1';
    this.beginAttack(A[key]);
  }

  beginAttack(a) {
    this.atkFrom = this.swordAngle();
    this.state = 'attack';
    this.atk = a;
    this.atkPhase = 'startup';
    this.atkT = 0;
    this.t = 0;
    this.hitActive = false;
    this.hitIdx = 0;
    this.comboT = 0;
    this.running = false;
    if (a.heavy && a.name !== 'dash') Sound.windup();
    if (a.shot) { this.takeAim(a.shot); Sound.bowDraw(); }
  }

  // One strike inside an attack: a fresh hit that can land on everyone again.
  beginHit(a, sweep, dur) {
    this.attackId++;
    this.hitActive = true;
    FX.slash(this, a, sweep, dur);
    Sound.swing(a.heavy || a.bothSides);
  }

  updateAttack(dt) {
    const a = this.atk, c = this.stats;
    this.atkT += dt;
    if (!a.air) {
      this.vx = approach(this.vx, 0, (a.name === 'dash' ? 900 : 2600) * dt);
      this.vz = approach(this.vz, 0, 2000 * dt);
    }

    if (this.atkPhase === 'startup' && this.atkT >= a.startup) {
      this.atkPhase = 'active';
      this.atkT -= a.startup;
      if (!a.air && this.onGround && a.lunge) this.vx = this.facing * a.lunge;
      if (a.iframes) this.invuln = Math.max(this.invuln, a.active + 0.06);
      if (a.wave) SwordWaves.fire(this.cx + this.facing * 40, this.facing, this.rageT > 0 ? Object.assign({}, a.wave, { dmg: a.wave.dmg * RAGE_CFG.dmgMul }) : a.wave);
      if (a.shot) {
        this.fireShot(a.shot);
      } else if (!a.hits) {
        this.beginHit(a);
        if (a.cross && a.sweep2) FX.slash(this, a, a.sweep2);
      }
      if (a.heavy) FX.shake(0.06);
    }
    if (this.atkPhase === 'active') {
      if (a.hits) {
        // twin strikes: each window is its own hit
        while (this.hitIdx < a.hits.length && this.atkT >= a.hits[this.hitIdx].at) {
          const h = a.hits[this.hitIdx];
          this.beginHit(a, this.hitIdx % 2 === 0 ? a.sweep : (a.sweep2 || a.sweep), h.dur);
          this.hitEnd = h.at + h.dur;
          this.hitIdx++;
        }
        if (this.hitActive && this.atkT >= this.hitEnd) this.hitActive = false;
      }
      if (this.atkT >= a.active) {
        this.atkPhase = 'recovery';
        this.atkT -= a.active;
        this.hitActive = false;
      }
    }
    if (this.atkPhase === 'recovery') {
      if (this.atkBuf > 0 && this.atkT >= a.chainAfter && a.next && this.onGround) {
        this.atkBuf = 0;
        const mx = this.control ? Input.axisX() : 0;
        if (mx) this.facing = mx;
        this.combo = a.comboIndex;
        const target = this.g.findGrabTarget(this);
        if (target) { this.startGrab(target); return; }
        this.beginAttack(this.cls.attacks[a.next]);
        return;
      }
      if (this.atkT >= a.recovery) {
        this.state = 'normal';
        this.atk = null;
        if (a.next) { this.combo = a.comboIndex; this.comboT = c.comboWindow; } else this.combo = 0;
      }
    }
  }

  // The Archer looses arrows straight down the lane she stands in.
  // Decided as the bow is drawn. Arrows keep to your lane; the bow only tilts
  // up when the nearest enemy in front, in your lane, is in the air.
  takeAim(s) {
    this.aimAng = s.angle || 0;
    if (s.angle) return;
    let best = 1e9, target = null;
    for (const e of this.g.enemies) {
      if (!e.active || e.untouchable || e.state === 'shadow') continue;
      const dx = (e.cx - this.cx) * this.facing;
      if (dx < 30 || dx > 520 || Math.abs(e.z - this.z) > LANE) continue;
      if (dx < best) { best = dx; target = e; }
    }
    if (!target) return;
    const rise = (target.y + target.h * 0.5) - (this.bottom - 28);
    if (rise < -20) this.aimAng = clamp(Math.atan2(rise, best), -0.95, 0);
  }

  fireShot(s) {
    const ang = this.aimAng || 0;
    const x = this.cx + this.facing * 22;
    const y = this.bottom - 28 + Math.sin(ang) * 10;
    const vx = this.facing * Math.cos(ang) * s.speed;
    const vy = Math.sin(ang) * s.speed;
    const spread = s.spread || [0];
    const spec = this.rageT > 0 ? Object.assign({}, s, { dmg: s.dmg * RAGE_CFG.dmgMul, knockdown: true }) : s;
    for (const dz of spread) Arrows.fire(x, this.z, y, vx, vy, dz * 2.2, spec);
    if (this.power === 'shower') this.arrowShower(!!s.fire);
    Sound.bow(!!s.fire);
    if (s.fire) FX.ring(x, FLOOR_Y + this.z + y, 4, 30, 0.2, false, 2);
  }

  // ------------------------------------------------ powerups and rage
  // The Archer's power: every shot also rains arrows over every lane ahead.
  arrowShower(fire) {
    const S = POWER_CFG.shower;
    const mul = this.rageT > 0 ? RAGE_CFG.dmgMul : 1;
    const spec = { speed: 0, dmg: S.dmg * mul, kb: 150, kbUp: -150, stagger: 0.3, knockdown: false, fire: fire, pierce: false, angle: 1.38 };
    for (let i = 0; i < S.arrows; i++) {
      const z = clamp((i + 0.5) * DEPTH / S.arrows + rand(-8, 8), 2, DEPTH - 2);
      const x = this.cx + this.facing * (80 + rand(0, 280));
      Arrows.fire(x - this.facing * 60, z, -(260 + rand(0, 90)), this.facing * 110, 640 + rand(0, 80), 0, spec);
    }
  }

  // Picking up a powerup.
  grantPower(kind) {
    if (kind === 'heal') {
      this.hp = Math.min(this.maxHp, this.hp + POWER_CFG.heal);
    } else if (kind === 'barrier') {
      this.barrier = POWER_CFG.barrier.hits;
      this.barrierT = POWER_CFG.barrier.time;
    } else if (kind === 'rage') {
      this.rage = RAGE_CFG.max;
    } else if (kind === 'power') {
      const k = { warrior: 'multi', archer: 'shower', rogue: 'flight' }[this.cls.key];
      this.power = k;
      if (k === 'flight') { this.fuel = POWER_CFG.flight.fuel; this.powerT = POWER_CFG.flight.expire; }
      else this.powerT = POWER_CFG[k].time;
    }
  }

  addRage(n) {
    if (this.rageT > 0 || !this.alive) return;
    this.rage = Math.min(RAGE_CFG.max, this.rage + n);
  }

  startRage() {
    if (this.rage < RAGE_CFG.max || this.rageT > 0 || !this.alive) return;
    this.rage = 0;
    this.rageT = RAGE_CFG.time;
    FX.ring(this.cx, this.screenY - 25, 10, 140, 0.5, false, 6);
    FX.burst(this.cx, this.screenY - 25, 24, 520, { streak: true, grav: 0 });
    FX.shake(0.3);
    Sound.rage();
    this.g.hitstop(0.08);
  }

  updateBuffs(dt) {
    if (this.rageT > 0) this.rageT -= dt;
    if (this.barrierT > 0) { this.barrierT -= dt; if (this.barrierT <= 0) this.barrier = 0; }
    if (this.power) {
      this.powerT -= dt;
      if (this.powerT <= 0 || (this.power === 'flight' && this.fuel <= 0 && this.onGround)) { this.power = null; this.fuel = 0; }
    }
  }

  // ------------------------------------------------ grab / knee / throw
  startGrab(e) {
    this.state = 'grab';
    this.t = 0;
    this.grabbed = e;
    this.knees = 0;
    this.kneeT = 0.15;
    this.vx = 0; this.vz = 0;
    this.running = false;
    e.grabbedBy(this);
    Sound.grab();
  }

  updateGrab(dt, mx) {
    const e = this.grabbed, G = GRAB_CFG;
    if (!e || !e.active || e.state !== 'grabbed') { this.grabbed = null; this.state = 'normal'; return; }
    this.vx = 0; this.vz = 0;
    e.x = this.cx + this.facing * 20 - e.w / 2;
    e.z = this.z;
    e.y = this.bottom - e.h;
    e.facing = -this.facing;
    this.kneeT -= dt;
    if (this.atkBuf > 0 && this.kneeT <= 0 && this.knees < G.knees) {
      this.atkBuf = 0;
      this.knees++;
      this.kneeT = 0.24;
      this.g.kneeHit(e, this);
      if (!e.active || e.state !== 'grabbed') { this.grabbed = null; this.state = 'normal'; }
      return;
    }
    if ((this.atkBuf > 0 && this.knees >= G.knees && this.kneeT <= 0) || mx === -this.facing || this.t >= G.holdTime) {
      this.atkBuf = 0;
      this.grabbed = null;
      e.throwBy(this, -this.facing);
      this.state = 'throw';
      this.t = 0;
      Sound.swing(true);
      FX.shake(0.1);
    }
  }

  // ------------------------------------------------ magic
  startMagic() {
    const level = this.pots;
    this.pots = 0;
    this.state = 'magic';
    this.t = 0;
    this.vx = 0; this.vz = 0;
    this.running = false;
    this.g.castMagic(level);
  }

  // ------------------------------------------------ drawing
  // Main weapon angle (local, facing right) for the current state.
  swordAngle() {
    const rest = this.cls.rest;
    const sword = this.cls.weapon === 'sword';
    if (this.state === 'attack' && this.atk) {
      const a = this.atk;
      if (a.shot) {
        const aim = this.aimAng || 0;
        if (this.atkPhase === 'startup') return lerp(this.atkFrom, aim, easeOutCubic(clamp(this.atkT / a.startup, 0, 1)));
        if (this.atkPhase === 'active') return aim;
        return lerp(aim, rest, easeInOutSine(clamp((this.atkT / a.recovery - 0.45) / 0.55, 0, 1)));
      }
      if (this.atkPhase === 'startup') {
        const windBack = a.heavy && a.name !== 'dash' ? a.sweep[0] - 0.25 : a.sweep[0];
        return lerp(this.atkFrom, windBack, easeOutCubic(clamp(this.atkT / a.startup, 0, 1)));
      }
      if (this.atkPhase === 'active') {
        const dur = a.hits ? a.hits[0].dur * 1.5 : a.active;
        return lerp(a.sweep[0], a.sweep[1], easeOutCubic(clamp(this.atkT / dur, 0, 1)));
      }
      const k = clamp((this.atkT / a.recovery - 0.45) / 0.55, 0, 1);
      const end = a.bothSides ? a.sweep[1] - TAU : a.sweep[1];
      return lerp(end, rest, easeInOutSine(k));
    }
    if (this.state === 'dash') return sword ? 2.85 : 2.5;
    if (this.state === 'grab') return this.kneeT > 0.12 ? -0.4 : -1.2;
    if (this.state === 'throw') return lerp(-0.3, -3.0, easeOutCubic(clamp(this.t / 0.25, 0, 1)));
    if (this.state === 'magic') return -Math.PI / 2 + Math.sin(this.t * 40) * 0.03 * (this.t < MAGIC_CFG.strikeAt ? 1 : 0);
    if (this.state === 'hurt') return -1.2;
    if (this.state === 'down' || this.state === 'getup') return 0.6;
    if (!this.onGround) return sword ? (this.vy < 0 ? -2.0 : -2.55) : (this.vy < 0 ? -0.6 : 0.4);
    if (this.running) return sword ? 2.8 : 2.4;
    const run = Math.min(1, Math.hypot(this.vx, this.vz) / this.stats.walkSpeed);
    return rest + run * 0.2 + Math.sin(this.runPhase * 2) * 0.05 * run + Math.sin(this.time * 2) * 0.03;
  }

  // The Rogue's off-hand dagger.
  swordAngle2() {
    const rest2 = this.cls.rest2 || 1.45;
    if (this.state === 'attack' && this.atk && this.atk.sweep2) {
      const a = this.atk;
      if (this.atkPhase === 'startup') return lerp(rest2, a.sweep2[0], clamp(this.atkT / a.startup, 0, 1));
      if (this.atkPhase === 'active') {
        const start = a.hits && a.hits[1] ? a.hits[1].at : 0;
        const dur = a.hits && a.hits[1] ? a.hits[1].dur * 1.5 : a.active;
        return lerp(a.sweep2[0], a.sweep2[1], easeOutCubic(clamp((this.atkT - start) / dur, 0, 1)));
      }
      const k = clamp((this.atkT / a.recovery - 0.45) / 0.55, 0, 1);
      const end = a.bothSides ? a.sweep2[1] - TAU : a.sweep2[1];
      return lerp(end, rest2, easeInOutSine(k));
    }
    if (this.state === 'grab' || this.state === 'throw' || this.state === 'magic' || this.state === 'hurt') return this.swordAngle() + 0.4;
    if (this.state === 'dash' || this.running) return 2.7;
    return rest2 + Math.sin(this.time * 2 + 1) * 0.03;
  }

  bowDraw() {
    if (this.state !== 'attack' || !this.atk || !this.atk.shot) return 0;
    if (this.atkPhase === 'startup') return clamp(this.atkT / this.atk.startup, 0, 1);
    return 0;
  }

  computePose() {
    const P = this.pose;
    P.x = this.cx; P.y = this.screenY; P.facing = this.facing; P.time = this.time;
    P.weapon = this.cls.weapon;
    P.sword = this.swordAngle();
    P.sword2 = this.cls.weapon === 'daggers' ? this.swordAngle2() : undefined;
    P.draw = this.bowDraw();
    P.fire = !!(this.atk && this.atk.shot && this.atk.shot.fire && P.draw > 0);
    const speed = Math.hypot(this.vx, this.vz);
    const run = Math.min(1, speed / this.stats.walkSpeed);
    const s = Math.sin(this.runPhase);
    if (this.state === 'dash') {
      P.legA = 0.9; P.legB = -0.7; P.lean = 0.35;
    } else if (!this.onGround && this.state !== 'down') {
      P.legA = this.vy < 0 ? 0.7 : 0.3; P.legB = this.vy < 0 ? -0.15 : -0.5; P.lean = 0.05;
    } else if (this.state === 'attack') {
      P.legA = 0.6; P.legB = -0.5;
      if (this.atk.shot) P.lean = this.atkPhase === 'startup' ? -0.08 : -0.02;
      else P.lean = this.atkPhase === 'startup' ? (this.atk.heavy ? -0.15 : -0.05) : (this.atk.name === 'dash' ? 0.35 : 0.2);
    } else if (this.state === 'grab') {
      const kneeing = this.kneeT > 0.1;
      P.legA = kneeing ? 1.6 : 0.3; P.legB = -0.3; P.lean = kneeing ? 0.15 : 0.05;
    } else if (this.state === 'throw' || this.state === 'magic') {
      P.legA = 0.5; P.legB = -0.5; P.lean = this.state === 'throw' ? -0.25 : 0;
    } else if (run > 0.08) {
      const amp = this.running ? 1.0 : 0.8;
      P.legA = s * amp; P.legB = -s * amp; P.lean = (this.running ? 0.3 : 0.12) * run;
    } else {
      P.legA = 0.2; P.legB = -0.22; P.lean = 0;
    }
    if (this.state === 'hurt') P.lean = -0.3;
    if (this.state === 'down') { P.lean = this.lying ? -1.45 : -0.8; P.legA = 0.4; P.legB = 0.1; }
    if (this.state === 'getup') { const k = clamp(this.t / this.stats.getupTime, 0, 1); P.lean = lerp(-1.45, 0, easeOutCubic(k)); P.legA = lerp(1.2, 0.2, k); P.legB = -0.2; }
    const sq = this.squash;
    P.sx = 1 + sq * 0.2;
    P.sy = 1 - sq * 0.2;
    P.cloak = Math.min(1, Math.abs(this.vx) / 360 + (this.onGround ? 0 : 0.35));
  }

  draw(ctx) {
    if (this.state === 'dead') { this.drawDeath(ctx); return; }
    this.computePose();
    const blink = (this.invuln > 0 && this.state !== 'dash' && !(this.atk && this.atk.iframes)) || this.state === 'getup';
    if (blink && this.state !== 'magic' && Math.floor(this.time * 18) % 2 === 0) ctx.globalAlpha = 0.35;
    if (this.rageT > 0) this.drawRageAura(ctx);
    this.pose.wings = this.power === 'flight' && (this.flying || !this.onGround) ? this.time : 0;
    drawFigure(ctx, this.pose, true);
    if (this.barrier > 0) this.drawBarrier(ctx);
    ctx.globalAlpha = 1;
  }

  // Jagged ink spikes around the figure while raging.
  drawRageAura(ctx) {
    const x = this.cx, y = this.screenY - 26, n = 14;
    const k = Math.min(1, this.rageT);
    ctx.save();
    ctx.globalAlpha = 0.85 * k;
    ctx.beginPath();
    for (let i = 0; i <= n * 2; i++) {
      const a = (i / (n * 2)) * TAU + this.time * 1.5;
      const r = (i % 2 === 0 ? 40 : 28) + Math.sin(this.time * 30 + i * 1.7) * 4;
      ctx.lineTo(x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.lineJoin = 'miter';
    finish(ctx);
    ctx.restore();
  }

  // The force field: an outlined bubble with one ring per hit it can still take.
  drawBarrier(ctx) {
    const x = this.cx, y = this.screenY - 26;
    const fade = this.barrierT < 2 && Math.floor(this.time * 10) % 2 === 0 ? 0.3 : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    for (let i = 0; i < this.barrier; i++) {
      const r = 36 + i * 5;
      ctx.setLineDash(i === 0 ? [] : [6, 5]);
      ctx.lineDashOffset = this.time * (i % 2 ? 30 : -30);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.8, r, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
  }

  // What is left behind where the hero fell.
  drawRelic(ctx, fall, Y) {
    ctx.save();
    ctx.lineJoin = 'round';
    const f = this.deathFacing;
    if (this.cls.weapon === 'bow') {
      // the bow lies on the ground, an arrow beside it
      ctx.translate(this.deathX + f * 24, Y - 3);
      ctx.scale(f, 1);
      ctx.beginPath();
      ctx.arc(0, 12, 20, -Math.PI + 0.5, -0.5);
      ctx.lineWidth = 4.5; ctx.strokeStyle = INK; ctx.stroke();
      ctx.lineWidth = 1.5; ctx.strokeStyle = PAPER; ctx.stroke();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-17.5, 2.4); ctx.lineTo(17.5, 2.4);
      ctx.stroke();
      drawArrowShape(ctx, -30, 6, 6, 4, false);
    } else if (this.cls.weapon === 'daggers') {
      // two daggers driven into the ground
      for (let i = 0; i < 2; i++) {
        ctx.save();
        ctx.translate(this.deathX + f * (18 + i * 14), Y + 6);
        ctx.rotate(-Math.PI / 2 + (i ? 0.25 : -0.2) + (1 - fall) * 0.6);
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(20, -3); ctx.lineTo(20, 3);
        ctx.closePath();
        finish(ctx);
        limb(ctx, 20, -6, 20, 6, 3);
        limb(ctx, 20, 0, 30, 0, 3);
        ctx.restore();
      }
    } else {
      // the sword is left planted in the ground
      ctx.translate(this.deathX + f * 26, Y + 12);
      ctx.scale(f, 1);
      ctx.rotate(-1.45 + (1 - fall) * 0.8);
      const L = PLAYER_CFG.bladeLength;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(L * 0.2, -6.5); ctx.lineTo(L, -6.5); ctx.lineTo(L, 6.5); ctx.lineTo(L * 0.2, 6);
      ctx.closePath();
      finish(ctx);
      limb(ctx, L + 12, 0, L, 0, 5);
      box(ctx, L - 2, -12, 5, 24);
    }
    ctx.restore();
  }

  drawDeath(ctx) {
    const t = this.deathT;
    const P = this.pose;
    const Y = FLOOR_Y + this.deathZ;
    const fall = easeOutCubic(clamp(t / 0.5, 0, 1));
