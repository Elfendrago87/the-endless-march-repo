name: Releases

# Publishes the releases listed in tools/releases.txt (notes and attachments),
# and keeps them in sync when the game, the manual, the changelog or the
# website change. Safe to re-run.
on:
  push:
    paths:
      - tools/releases.txt
      - tools/publish-releases.sh
      - .github/workflows/releases.yml
      - dist/The-Endless-March.exe
      - MANUAL.md
      - CHANGELOG.md
      - docs/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish releases
        run: bash tools/publish-releases.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
